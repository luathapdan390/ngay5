<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video và Ghi Chú</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        textarea {
            resize: vertical;
            min-height: 400px;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

    <!-- Tiêu đề trang -->
    <h1 class="text-3xl md:text-4xl font-bold mb-6 text-center text-gray-800">Video và Ghi Chú</h1>
    
    <div class="w-full max-w-5xl flex flex-col lg:flex-row space-y-6 lg:space-y-0 lg:space-x-8">
        
        <!-- Phần Video YouTube -->
        <div class="flex-1 bg-white p-4 rounded-xl shadow-lg border border-gray-200">
            <h2 class="text-2xl font-semibold mb-4 text-gray-700">Video YouTube</h2>
            <div class="aspect-w-16 aspect-h-9 w-full">
                <!-- Video nhúng -->
                <iframe 
                    class="rounded-lg w-full h-full" 
                    src="https://www.youtube.com/embed/QBuIYZNNMdQ" 
                    title="YouTube video player" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>
        
        <!-- Phần Ghi Chú -->
        <div class="flex-1 bg-white p-4 rounded-xl shadow-lg border border-gray-200">
            <h2 class="text-2xl font-semibold mb-4 text-gray-700">Ghi Chú</h2>
            <div class="w-full h-full">
                <!-- Vùng văn bản để ghi chú -->
                <textarea 
                    id="notes-area"
                    class="w-full h-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200"
                    placeholder="Bắt đầu ghi chú của bạn ở đây..."
                ></textarea>
            </div>
        </div>
    </div>
    
    <script>
        // Lấy tham chiếu đến vùng ghi chú
        const notesArea = document.getElementById('notes-area');
        
        // Key để lưu dữ liệu vào localStorage
        const storageKey = 'my-video-notes';

        // Lấy dữ liệu đã lưu khi trang được tải
        document.addEventListener('DOMContentLoaded', () => {
            const savedNotes = localStorage.getItem(storageKey);
            if (savedNotes) {
                notesArea.value = savedNotes;
            }
        });

        // Tự động lưu dữ liệu vào localStorage mỗi 1 giây
        notesArea.addEventListener('input', () => {
            clearTimeout(window.saveTimer); // Xóa timer cũ nếu người dùng vẫn đang gõ
            window.saveTimer = setTimeout(() => {
                localStorage.setItem(storageKey, notesArea.value);
                console.log('Ghi chú đã được lưu tự động!');
            }, 1000); // Lưu sau 1 giây không có sự thay đổi
        });
        
        // Xóa timer khi người dùng rời khỏi trang
        window.addEventListener('beforeunload', () => {
             clearTimeout(window.saveTimer);
             localStorage.setItem(storageKey, notesArea.value); // Lưu lần cuối
        });
    </script>
</body>
</html>
